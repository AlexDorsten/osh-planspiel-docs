# Lizenzzuordnung dieses Dokumentationsrepos; siehe LIZENZ.md.
# Keine globale Vorgabe für unbekannte neue Dateien oder separat verwalteten
# App-Code. Vorhandene Angaben in Dateien/Sidecars haben mit "closest" Vorrang.

# Eigene Dokumentation, Herkunftsnachweise und Repository-Metadaten.
[[annotations]]
path = [
  ".gitattributes",
  ".gitignore",
  "README.md",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LIZENZ.md",
  "agents-und-skills/README.md",
  "agents-und-skills/agents/*.md",
  "agents-und-skills/manifest.json",
  "agents-und-skills/nachweise.md",
  "agents-und-skills/skills/.gitattributes",
  "agents-und-skills/skills/README.md",
  "agents-und-skills/skills/*/README.md",
  "originalmaterial/zenodo-17811561/README.md",
  "originalmaterial/zenodo-17811561/manifest.json",
  "originalmaterial/zenodo-17811561/SHA256SUMS",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Contributors to the OSH-Planspiel project <https://github.com/AlexDorsten/osh-planspiel-docs>"
SPDX-License-Identifier = "CC-BY-4.0"

